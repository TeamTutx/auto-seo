# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend (backend/) and the marketing/app frontend
# (frontend/) as a static site. Celery worker/beat + Redis are deliberately not
# included yet - scheduled audits (backend/README.md "Scheduled audits +
# alerts") work locally but aren't provisioned here; see plan.md "Not yet
# scheduled" for why and how to add them back.
#
# After the first "Apply" in the Render dashboard, fill in every env var
# below marked `sync: false` (Render prompts for these - they're not stored
# in this file). FRONTEND_URL/GOOGLE_REDIRECT_URI/CORS_ORIGINS depend on
# where the frontend ends up and this service's own Render URL, so they're
# easiest to fill in *after* the first deploy once both URLs are known - see
# backend/README.md "Deploying (Render)".

databases:
  - name: signal-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: signal-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # preDeployCommand isn't available on the free plan - Render's own docs
    # recommend folding migrations into startCommand instead. Alembic is
    # idempotent (no-ops once already at head), so this is safe to re-run on
    # every cold start (free web services spin down after 15 min idle).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      # Fill in after the first deploy (see note above).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # "Sign in with Google": <this API>/auth/google/callback. Must also be
      # registered on the OAuth client, and the consent screen must be
      # published or only test users can sign in.
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false

      # Rank checks / competitor comparison - pick one provider and fill in
      # its credentials; the other pair can stay blank.
      - key: RANK_PROVIDER
        value: serpapi
      - key: SERPAPI_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false

      # AI suggestions - pick one provider.
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Google Search Console / Analytics OAuth client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Admin panel: emails allowed into /admin (comma-separated).
      - key: ADMIN_EMAILS
        sync: false

      # Billing (Dodo Payments) - see backend/README.md "Billing & admin".
      # Billing stays off until both keys are set.
      - key: DODO_API_KEY
        sync: false
      - key: DODO_WEBHOOK_KEY
        sync: false
      - key: DODO_ENVIRONMENT
        value: test_mode

  # The frontend: a Next.js static export (frontend/next.config.mjs sets
  # `output: "export"`), served from Render's CDN. Static sites are free and
  # don't spin down, which matters because the public pages are the ones
  # search engines crawl.
  #
  # `rootDir` scopes autodeploys as well as paths: a backend-only commit does
  # not rebuild the site, which keeps build minutes (a metered resource on the
  # free workspace) for changes that actually alter it.
  - type: web
    name: signal-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      # Baked into the bundle at build time, so these are build inputs, not
      # runtime config - changing one needs a rebuild, not a restart. The
      # landing page also *fetches* this API during the build to render real
      # prices into the HTML, so it must be reachable when the build runs.
      - key: NEXT_PUBLIC_API_URL
        value: https://api.signal-seo.in
      - key: NEXT_PUBLIC_SITE_URL
        value: https://signal-seo.in
    routes:
      # The dashboard used to live at /dashboard/sites/:id/... and
      # /admin/users/:id. Those ids can't be enumerated at build time, so the
      # routes now carry them in the query string (frontend/lib/routes.ts).
      # A *rewrite* (not a redirect) keeps the original path in the address bar,
      # which is what lets /legacy-link read it and forward to the new URL.
      # Render skips these rules for paths where a file exists, so real pages
      # under /dashboard are unaffected.
      #
      # The destination needs the `.html` extension. A *request* for /foo
      # resolves to foo.html, but a rewrite destination is matched literally:
      # pointing it at /legacy-link served an empty 200 (verified in
      # production, and cached at the edge for five minutes before it could be
      # re-tested - so re-check with a cache-busting query string).
      - type: rewrite
        source: /dashboard/sites/*
        destination: /legacy-link.html
      - type: rewrite
        source: /admin/users/*
        destination: /legacy-link.html
